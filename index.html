<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b87">
  <meta name="description" content="ต้นแบบเว็บคุมงานสำหรับ Klao Built-in">
  <title>Klao Built-in · คุมงาน</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=5">
  <script src="./app.js?v=5" defer></script>
</head>
<body>
  <aside class="rail" aria-label="เมนูหลัก">
    <button class="mark" id="logo" aria-label="Klao Built-in บ้านทั้งหมด"></button>
    <nav id="nav"></nav>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span>Klao</span> Built-in</div>
      <div class="header-actions">
        <span class="top-status" id="connection">ข้อมูลตัวอย่าง</span>
        <button class="text-button install-button" id="install" type="button" title="ติดตั้งแอป" aria-label="ติดตั้งแอป" hidden>
          <span>ติดตั้งแอป</span>
        </button>
      </div>
    </header>
    <main id="content"></main>
  </div>
  <button id="add" class="fab" type="button" aria-label="เพิ่มงาน" title="เพิ่มงาน" hidden></button>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
